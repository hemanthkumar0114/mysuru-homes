# Activate with SPRING_PROFILES_ACTIVE=local (or --spring.profiles.active=local).
# In-memory H2 database so the project can be run and viewed without installing
# Postgres or Docker. Not for anything beyond local demoing - real dev/prod use
# the default profile's Postgres config in application.yml.
spring:
  datasource:
    url: jdbc:h2:mem:real_estate;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  seed-demo-data: true
