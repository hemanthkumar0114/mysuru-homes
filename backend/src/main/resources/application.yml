spring:
  application:
    name: api

  web:
    error:
      # Exception messages are never exposed by Boot's default error page.
      # GlobalExceptionHandler writes the {"message": "..."} body itself, so
      # only messages we chose for the user ever reach the browser.
      include-message: never
      # Dev tools switch these on in development; never send Java stack
      # traces or internal field/binding details to the browser.
      include-stacktrace: never
      include-binding-errors: never

  datasource:
    # Defaults match the dedicated app user created by backend/sql/setup.sql -
    # run that once in MySQL Workbench, no root password needed here. No
    # explicit useSSL/sslMode here - the driver's default (sslMode=PREFERRED)
    # encrypts the connection when the server offers TLS (e.g. Aiven, which
    # requires it) and falls back to plaintext for a local MySQL that has no
    # certificate configured, so the same URL works in both places.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:real_estate}?allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:realestate_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    # A database that already has tables but no Flyway history (the live Aiven
    # database, or a local one built by the old ddl-auto: update) is marked as
    # already being at version 1 instead of running V1 on top of it. An empty
    # database runs every migration from V1.
    baseline-on-migrate: true
    baseline-version: 1
    placeholders:
      long_text_type: LONGTEXT

  jpa:
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration); Hibernate never
      # changes it. The test suite runs with ddl-auto: validate, so a migration that
      # doesn't match the entities fails the tests instead of failing a deploy.
      # A schema change = a new file V2__what_changed.sql, never an edit to an old one.
      ddl-auto: none
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}
  error:
    include-message: never

spring.servlet.multipart:
  # A bit above the 3MB-per-photo app limit (see ListingPhotoController) so a
  # request with several photos still fits comfortably.
  max-file-size: 4MB
  max-request-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  # Runs the account/listing seeder on first run (only when the users table is
  # empty - see DemoDataSeeder). Safe to leave on everywhere: every account it
  # creates comes from the env vars below, so it creates nothing at all if
  # none of them are set.
  seed-demo-data: true
  # Seeds the Mysuru-corridor locality pages on first run - same "only if empty" rule.
  seed-localities: true
  # Folder where uploaded listing photos are stored, relative to where the jar
  # runs unless given as an absolute path. Served back at /uploads/**. Ignored
  # when Cloudinary is configured below - photos go there instead.
  upload-dir: ${UPLOAD_DIR:uploads}
  jwt:
    # Must be set via the JWT_SECRET env var - no default, so the app
    # refuses to start with a known/guessable secret.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # Comma-separated origins the browser is allowed to call this API from.
    # Set ALLOWED_ORIGINS to your Netlify URL in production.
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  # The ONLY way an admin account gets created (see DemoDataSeeder) - there is
  # no hardcoded admin password. Leave both unset to skip creating one.
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  # Optional demo OWNER/TENANT accounts (with a couple of sample listings for
  # the owner) - each is only created if its own email+password are both set.
  # Never given a default password, so a public deployment that leaves these
  # unset simply won't have them.
  demo-owner:
    email: ${DEMO_OWNER_EMAIL:}
    password: ${DEMO_OWNER_PASSWORD:}
  demo-tenant:
    email: ${DEMO_TENANT_EMAIL:}
    password: ${DEMO_TENANT_PASSWORD:}
  # Optional: route uploaded photos to Cloudinary's free tier instead of local
  # disk, so they survive a Render restart/redeploy (which wipes local disk).
  # Leave both unset to keep saving to upload-dir above (fine for local dev).
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    upload-preset: ${CLOUDINARY_UPLOAD_PRESET:}
