spring:
  application:
    name: api

  datasource:
    # Defaults match the dedicated app user created by backend/sql/setup.sql -
    # run that once in MySQL Workbench, no root password needed here.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:real_estate}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:realestate_app}
    password: ${DB_PASSWORD:REDACTED-OLD-DEV-PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # create/update the schema automatically - fine for local dev, switch to
      # Flyway/Liquibase migrations before this touches a shared database.
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}
  error:
    # So {"message": "..."} on our custom @ResponseStatus exceptions
    # (EmailAlreadyRegisteredException, InvalidCredentialsException, etc.)
    # actually reaches the frontend's error boxes instead of being stripped.
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  # Seeds a few sample listings on first run so the UI isn't empty. Safe to
  # leave on - the seeder checks the table is empty before inserting anything.
  seed-demo-data: true
  jwt:
    # Dev-only default secret. Override with the JWT_SECRET env var for
    # anything beyond your own machine.
    secret: ${JWT_SECRET:REDACTED-OLD-DEV-JWT-SECRET-PLACEHOLDER}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
