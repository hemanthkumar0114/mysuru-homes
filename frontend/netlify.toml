[build]
  command = "npm run build"
  publish = "dist"

# React Router uses client-side routing (BrowserRouter), so a hard refresh or
# direct link to e.g. /listings/abc123 must still serve index.html and let
# the app's router take over - otherwise Netlify looks for a file at that
# path and returns its own 404 page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
