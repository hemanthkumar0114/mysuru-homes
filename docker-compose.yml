# Optional: only needed if you don't already have a local MySQL server
# running (this project detected a native MySQL 8.0 install + Workbench
# on this machine, so you likely don't need this). If you do use it,
# point application.yml's DB_HOST at "localhost" as usual - the container
# publishes the standard port 3306.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: real_estate
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
